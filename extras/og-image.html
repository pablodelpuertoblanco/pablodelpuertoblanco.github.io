<!DOCTYPE html>
<!-- Plantilla de la imagen para redes (assets/img/og-image.png, 1200x630).
     Para regenerarla: abre este archivo con Live Server, pon la ventana del
     navegador a 1200x630 (DevTools → modo dispositivo) y haz una captura. -->
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>OG image</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&family=Red+Hat+Text:wght@500;600&display=swap">
  <link rel="stylesheet" href="../css/tokens.css">
  <style>
    html, body { margin: 0; }
    body {
      width: 1200px; height: 630px; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: var(--font-text);
      position: relative;
    }
    .grid {
      position: absolute; inset: 0;
      background-image: radial-gradient(rgb(154 176 200 / 0.16) 1.2px, transparent 1.8px);
      background-size: 26px 26px;
      mask-image: radial-gradient(ellipse 60% 85% at 78% 50%, #000 25%, transparent 75%);
    }
    .text { position: absolute; left: 80px; top: 62px; width: 640px; }
    .status {
      display: inline-flex; align-items: center; gap: 12px;
      padding: 8px 18px 8px 14px; border: 1px solid var(--line); border-radius: 999px;
      color: var(--muted); font-size: 22px; font-weight: 500;
    }
    .led { width: 12px; height: 12px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 5px var(--amber-soft); }
    h1 {
      margin: 30px 0 0; font-family: var(--font-display); font-weight: 900;
      font-size: 96px; line-height: 0.93; letter-spacing: -0.035em; word-spacing: 0.06em;
    }
    .role { margin-top: 26px; font-family: var(--font-display); font-size: 36px; font-weight: 500; }
    .role span { color: var(--muted); }
    .bar { position: absolute; left: 80px; bottom: 46px; display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 22px; font-weight: 600; }
    .bar svg { width: 40px; height: 40px; }
    .topo { position: absolute; right: 70px; top: 85px; width: 460px; height: 460px; }
    .topo svg.links { position: absolute; inset: 0; }
    .photo {
      position: absolute; left: 50%; top: 50%; width: 46%; aspect-ratio: 1; transform: translate(-50%, -50%);
      border-radius: 50%; background: #fff url("../assets/img/avatar.webp") center / cover;
      box-shadow: 0 0 0 8px var(--bg), 0 0 0 11px var(--avatar-ring);
    }
    .core-led { position: absolute; left: 67%; top: 31%; width: 22px; height: 22px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 6px var(--bg); }
    .pkt { fill: var(--amber); }
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="text">
    <div class="status"><span class="led"></span>Abierto a nuevas oportunidades</div>
    <h1>Pablo<br>del Puerto Blanco</h1>
    <p class="role">Programador y técnico IT <span>en Madrid</span></p>
  </div>
  <div class="bar">
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="1" y="1" width="62" height="62" rx="14" fill="#062446" stroke="#2b557f" stroke-width="2"/><circle cx="30" cy="34" r="13" fill="none" stroke="#eaf1f8" stroke-width="5"/><circle cx="46" cy="17" r="6" fill="#ffb547"/></svg>
    Apps móviles, sistemas y redes, datos y web
  </div>
  <div class="topo">
    <svg class="links" viewBox="0 0 100 100" preserveAspectRatio="none">
      <g stroke="#9ab0c8" stroke-opacity="0.5" stroke-width="0.45" stroke-dasharray="0.8 1.6" stroke-linecap="round">
        <line x1="50" y1="50" x2="16" y2="12"/><line x1="50" y1="50" x2="88" y2="22"/>
        <line x1="50" y1="50" x2="86" y2="86"/><line x1="50" y1="50" x2="12" y2="78"/>
        <line x1="16" y1="12" x2="88" y2="22" stroke-opacity="0.25"/><line x1="88" y1="22" x2="86" y2="86" stroke-opacity="0.25"/>
        <line x1="86" y1="86" x2="12" y2="78" stroke-opacity="0.25"/><line x1="12" y1="78" x2="16" y2="12" stroke-opacity="0.25"/>
      </g>
      <circle class="pkt" cx="24" cy="21" r="1.3"/><circle class="pkt" cx="78" cy="78" r="1.3"/><circle class="pkt" cx="52" cy="17.5" r="1.1" opacity="0.7"/>
      <circle cx="16" cy="12" r="2.4" fill="#062446" stroke="#2b557f" stroke-width="0.5"/>
      <circle cx="88" cy="22" r="2.4" fill="#062446" stroke="#ffb547" stroke-width="0.6"/>
      <circle cx="86" cy="86" r="2.4" fill="#062446" stroke="#2b557f" stroke-width="0.5"/>
      <circle cx="12" cy="78" r="2.4" fill="#062446" stroke="#2b557f" stroke-width="0.5"/>
    </svg>
    <div class="photo"></div>
    <div class="core-led"></div>
  </div>
</body>
</html>
