<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Página no encontrada | Pablo del Puerto Blanco</title>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@900&family=Red+Hat+Text:wght@400;600&display=swap">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <script>
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <style>
    main { min-height: 100vh; display: grid; place-content: center; gap: 1.25rem; padding: 2rem; text-align: center; }
    .code { font-family: var(--font-display); font-weight: 900; font-size: clamp(5rem, 20vw, 10rem); line-height: 0.9; letter-spacing: -0.05em; }
    .code span { color: var(--amber); }
    p { color: var(--muted); max-width: 30rem; }
    .btn { justify-self: center; }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">4<span>0</span>4</p>
    <h1>Este puerto está cerrado</h1>
    <p>La página que buscas no existe o ha cambiado de dirección.</p>
    <a class="btn btn--primary" href="/">Volver al inicio</a>
  </main>
</body>
</html>
